<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveLog PRO</title><style>*{box-sizing:border-box}body{background:#101b2c;color:#edf5ff;font:16px system-ui;margin:0}main{max-width:760px;margin:auto;padding:22px}h1{margin-bottom:4px}em{color:#39dfb6;font-style:normal}section{background:#1b2b40;padding:20px;border-radius:16px;margin:16px 0}label{display:block;margin:10px 0 4px;color:#b7c8da}input,select,button{font:inherit;border:1px solid #41566e;border-radius:9px;padding:11px;background:#101b2c;color:white;width:100%}button{cursor:pointer;background:#39dfb6;color:#102b29;font-weight:700;border:0;margin-top:10px}button.alt{background:#30455e;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{font-size:30px;font-weight:700;color:#39dfb6}.muted{color:#b7c8da;font-size:13px}article{border-top:1px solid #41566e;padding:12px 0}article button{width:auto;margin-right:8px}h2{font-size:19px;margin-top:0} </style><main><h1>DriveLog <em>PRO</em></h1><div class="muted">Dein digitales Fahrtenbuch · Version 1.0</div><section><h2>Übersicht</h2><div class="grid"><div><label>Zeitraum</label><select id="period"><option value="all">Alle Fahrten</option><option value="month">Dieser Monat</option><option value="year">Dieses Jahr</option></select></div><div><label>Fahrzeug</label><select id="filter"></select></div></div><div class="num" id="total"></div><div id="stats"></div></section><section><h2>Fahrzeuge</h2><form id="vehicleForm"><label>Fahrzeug / Kennzeichen</label><input id="vehicleName" required maxlength="80" placeholder="z. B. B-AB 123"><button>Fahrzeug hinzufügen</button></form><div id="vehicles"></div></section><section><h2 id="formTitle">Neue Fahrt</h2><form id="tripForm"><label>Fahrzeug</label><select id="vehicle" required></select><label>Datum</label><input id="date" type="date" required><div class="grid"><div><label>Startort</label><input id="origin" required></div><div><label>Zielort</label><input id="destination" required></div><div><label>KM-Stand Start</label><input id="start" type="number" min="0" step="1" required></div><div><label>KM-Stand Ende</label><input id="end" type="number" min="0" step="1" required></div></div><label>Art</label><select id="kind"><option>Geschäftlich</option><option>Privat</option></select><label>Fahrtzweck</label><input id="purpose"><p id="distance" class="num">0 km</p><button>Fahrt speichern</button><button type="button" class="alt" id="cancel" hidden>Bearbeitung abbrechen</button></form></section><section><h2>Fahrten im gewählten Zeitraum</h2><div id="list"></div><button id="csv">CSV für Excel exportieren</button></section><p class="muted">Daten bleiben in diesem Browserprofil. Regelmäßig exportieren. Kein manipulationssicheres steuerliches Fahrtenbuch. Keine GPS-Aufzeichnung.</p></main><script>
const $=id=>document.getElementById(id), key='drivelog-pro-v1';let data={vehicles:[],trips:[]},editing=null;try{const v=localStorage.getItem(key);if(v)data=JSON.parse(v)}catch(e){alert('Lokaler Speicher konnte nicht geladen werden.')}const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();function persist(next){try{localStorage.setItem(key,JSON.stringify(next));data=next;return true}catch(e){alert('Speichern fehlgeschlagen. Bitte Browsereinstellungen prüfen.');return false}}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function filtered(){return data.trips.filter(t=>($('filter').value==='all'||t.vehicle===$('filter').value)&&($('period').value==='all'||t.date.startsWith(today().slice(0,$('period').value==='month'?7:4))))}function options(){for(const name of ['vehicle','filter']){let el=$(name),old=el.value;el.replaceChildren();if(name==='filter')el.add(new Option('Alle Fahrzeuge','all'));else el.add(new Option('Bitte wählen',''));for(const v of data.vehicles)el.add(new Option(v.name,v.id));if([...el.options].some(o=>o.value===old))el.value=old} $('vehicles').textContent=data.vehicles.map(v=>v.name).join(' · ')}function render(){const ts=filtered(),sum=k=>ts.filter(t=>!k||t.kind===k).reduce((s,t)=>s+t.end-t.start,0);$('total').textContent=sum()+' km';$('stats').textContent=`${ts.length} Fahrten · Geschäftlich ${sum('Geschäftlich')} km · Privat ${sum('Privat')} km`;$('list').replaceChildren();if(!ts.length)$('list').textContent='Noch keine Fahrten.';for(const t of [...ts].sort((a,b)=>b.date.localeCompare(a.date))){let a=document.createElement('article'),b=document.createElement('strong'),p=document.createElement('p');b.textContent=t.origin+' → '+t.destination+' · '+(t.end-t.start)+' km';p.textContent=t.date+' · '+(data.vehicles.find(v=>v.id===t.vehicle)?.name||'')+' · '+t.kind+' · '+t.purpose;a.append(b,p);for(const [label,fn] of [['Bearbeiten',()=>edit(t)],['Löschen',()=>{if(confirm('Fahrt löschen?')&&persist({...data,trips:data.trips.filter(x=>x.id!==t.id)})){if(editing===t.id)reset();render()}}]]){let btn=document.createElement('button');btn.className='alt';btn.textContent=label;btn.onclick=fn;a.append(btn)}$('list').append(a)}}function edit(t){editing=t.id;for(const k of ['vehicle','date','origin','destination','start','end','kind','purpose'])$(k).value=t[k];$('formTitle').textContent='Fahrt bearbeiten';$('cancel').hidden=false;distance();$('tripForm').scrollIntoView()}function reset(){editing=null;$('tripForm').reset();$('date').value=today();$('formTitle').textContent='Neue Fahrt';$('cancel').hidden=true;distance()}function distance(){$('distance').textContent=(Math.max(0,Number($('end').value)-Number($('start').value)))+' km'}$('start').oninput=$('end').oninput=distance;$('cancel').onclick=reset;$('filter').onchange=$('period').onchange=render;$('vehicleForm').onsubmit=e=>{e.preventDefault();let name=$('vehicleName').value.trim();if(!name)return;let v={name,id:id()};if(persist({...data,vehicles:[...data.vehicles,v]})){options();$('vehicle').value=v.id;$('vehicleName').value='';render()}};$('tripForm').onsubmit=e=>{e.preventDefault();let t={id:editing||id()};for(const k of ['vehicle','date','origin','destination','kind','purpose'])t[k]=$(k).value.trim();for(const k of ['start','end'])t[k]=Number($(k).value);if(t.end<=t.start||!t.origin||!t.destination){alert('Bitte gültige Strecke und Orte eingeben.');return}let trips=editing?data.trips.map(x=>x.id===editing?t:x):[...data.trips,t];if(persist({...data,trips})){reset();render()}};$('csv').onclick=()=>{let quote=v=>'"'+String(v).replace(/^[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';let rows=[['Datum','Fahrzeug','Start','Ziel','KM Start','KM Ende','Strecke','Art','Zweck'],...filtered().map(t=>[t.date,data.vehicles.find(v=>v.id===t.vehicle)?.name||'',t.origin,t.destination,t.start,t.end,t.end-t.start,t.kind,t.purpose])];let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='DriveLog_Fahrten.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};options();render();</script></html>
